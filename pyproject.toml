[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinelnet"
version = "1.0.0"
description = "ML-assisted network anomaly detection with live capture and PCAP replay"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Bejjam Charan Sai Teja" }]
keywords = ["network-security", "anomaly-detection", "ids", "scapy", "machine-learning"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
  "License :: OSI Approved :: MIT License",
]
dependencies = [
  "scapy>=2.6,<3",
  "scikit-learn>=1.4,<2",
  "numpy>=1.26,<3",
  "pydantic>=2.6,<3",
  "pydantic-settings>=2.2,<3",
  "joblib>=1.3,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<10",
  "pytest-cov>=5,<7",
  "ruff>=0.6",
  "mypy>=1.10",
  "bandit>=1.7",
  "pip-audit>=2.7",
]

[project.scripts]
sentinelnet = "sentinel_net.cli:main"

[tool.setuptools.packages.find]
include = ["sentinel_net*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --cov=sentinel_net --cov-report=term-missing --cov-fail-under=85"

[tool.coverage.run]
branch = true
source = ["sentinel_net"]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = [".venv", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "C4", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true
check_untyped_defs = true
ignore_missing_imports = true
exclude = ["build", "dist"]
